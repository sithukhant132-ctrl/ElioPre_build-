<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RigDirect PC Store</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero" data-aos="fade-up">
    <h1>RigDirect</h1>
    <p>Bangkok’s Valorant‑styled PC Store</p>
    <button>Shop Now</button>
  </section>

  <!-- Product Showcase -->
  <section class="products" data-aos="fade-up">
    <h2>Our Builds</h2>
    <div class="product-grid">
      <div class="product-card" data-aos="zoom-in">
        <img src="assets/study-build.png" alt="Study Build">
        <h3>Study Build</h3>
        <p>฿12,900</p>
        <button>Buy Now</button>
      </div>
      <div class="product-card" data-aos="zoom-in">
        <img src="assets/office-build.png" alt="Office Build">
        <h3>Office Build</h3>
        <p>฿16,500</p>
        <button>Buy Now</button>
      </div>
      <div class="product-card" data-aos="zoom-in">
        <img src="assets/esport-build.png" alt="eSport Build">
        <h3>eSport Build</h3>
        <p>฿25,900</p>
        <button>Buy Now</button>
      </div>
      <div class="product-card" data-aos="zoom-in">
        <img src="assets/triplea-build.png" alt="Triple A Build">
        <h3>Triple A Build</h3>
        <p>฿42,000</p>
        <button>Buy Now</button>
      </div>
      <div class="product-card" data-aos="zoom-in">
        <img src="assets/pro-build.png" alt="Professional Build">
        <h3>Professional Build</h3>
        <p>฿65,000</p>
        <button>Buy Now</button>
      </div>
    </div>
  </section>

  <!-- Contact -->
  <section class="contact" data-aos="fade-up">
    <h2>Contact Us</h2>
    <p>LINE Official Account | PromptPay | Nationwide Delivery</p>
  </section>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
